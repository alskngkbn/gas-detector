<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gas Detector</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0d1117;
        color: #e6edf3;
        padding: 24px;
      }
      h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 1.5em;
      }
      .subtitle {
        text-align: center;
        color: #8b949e;
        margin-bottom: 24px;
        font-size: 0.85em;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        max-width: 720px;
        margin: 0 auto;
      }
      .card {
        background: #161b22;
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #30363d;
      }
      .card.full {
        grid-column: span 2;
      }
      .card h3 {
        font-size: 0.8em;
        color: #8b949e;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .value {
        font-size: 2.2em;
        font-weight: bold;
      }
      .unit {
        font-size: 0.85em;
        color: #8b949e;
      }
      .AMAN {
        color: #3fb950;
      }
      .WASPADA {
        color: #d29922;
      }
      .BAHAYA {
        color: #f85149;
      }
      .bar-bg {
        background: #21262d;
        border-radius: 99px;
        height: 10px;
        margin-top: 10px;
      }
      .bar-fill {
        height: 10px;
        border-radius: 99px;
        transition:
          width 0.5s,
          background 0.5s;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.95em;
        cursor: pointer;
      }
      #btnFanOn {
        background: #238636;
        color: white;
      }
      #btnFanOff {
        background: #da3633;
        color: white;
      }
      #btnFanAuto {
        background: #1f6feb;
        color: white;
      }
      #btnServoT {
        background: #da3633;
        color: white;
      }
      #btnServoB {
        background: #238636;
        color: white;
      }
      #btnServoA {
        background: #1f6feb;
        color: white;
      }
      .conn-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: #f85149;
      }
      .conn-dot.connected {
        background: #3fb950;
      }
      .timestamp {
        font-size: 0.75em;
        color: #8b949e;
        margin-top: 8px;
      }

      /* Login screen */
      #loginScreen {
        max-width: 400px;
        margin: 80px auto;
        background: #161b22;
        border-radius: 12px;
        padding: 32px;
        border: 1px solid #30363d;
      }
      #loginScreen h2 {
        margin-bottom: 20px;
        text-align: center;
      }
      #loginScreen input {
        width: 100%;
        padding: 10px 14px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        color: #e6edf3;
        font-size: 0.95em;
        margin-bottom: 12px;
      }
      #loginScreen button {
        width: 100%;
        padding: 12px;
        background: #1f6feb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
      }
      #loginScreen .hint {
        font-size: 0.78em;
        color: #8b949e;
        margin-top: 10px;
        text-align: center;
      }
      #dashboard {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div id="loginScreen">
      <h2>🔐 Gas Detector Login</h2>
      <input type="text" id="inputUser" placeholder="Adafruit IO Username" />
      <input
        type="password"
        id="inputKey"
        placeholder="Adafruit IO Key (aio_xxxxx)"
      />
      <button onclick="startConnect()">🔌 Connect</button>
      <p class="hint">
        Kredensial tidak disimpan — hanya dipakai saat sesi ini
      </p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
      <h1>🔥 Gas Leak Monitor</h1>
      <p class="subtitle">
        <span class="conn-dot" id="connDot"></span>
        <span id="connLabel">Menghubungkan...</span>
      </p>

      <div class="grid">
        <div class="card">
          <h3>Status Kebocoran</h3>
          <div class="value AMAN" id="gasStatus">—</div>
        </div>
        <div class="card">
          <h3>Level Gas</h3>
          <div>
            <span class="value" id="gasLevel">—</span>
            <span class="unit">%</span>
          </div>
          <div class="bar-bg">
            <div
              class="bar-fill"
              id="gasBar"
              style="width: 0%; background: #3fb950"
            ></div>
          </div>
        </div>
        <div class="card">
          <h3>Suhu</h3>
          <div>
            <span class="value" id="temp">—</span> <span class="unit">°C</span>
          </div>
        </div>
        <div class="card">
          <h3>Kelembapan</h3>
          <div>
            <span class="value" id="hum">—</span> <span class="unit">%</span>
          </div>
        </div>

        <div class="card full">
          <h3>Kontrol Kipas</h3>
          <div>Status: <strong id="fanStatus">—</strong></div>
          <div class="btn-row">
            <button id="btnFanOn" onclick="fanControl('ON')">🌀 ON</button>
            <button id="btnFanOff" onclick="fanControl('OFF')">⏹ OFF</button>
            <button id="btnFanAuto" onclick="fanControl('AUTO')">
              🔄 Auto
            </button>
          </div>
        </div>

        <div class="card full">
          <h3>Kontrol Regulator Gas (Servo)</h3>
          <div>Status: <strong id="regStatus">TERBUKA</strong></div>
          <div class="btn-row">
            <button id="btnServoT" onclick="servoControl('TUTUP')">
              🔒 Tutup
            </button>
            <button id="btnServoB" onclick="servoControl('BUKA')">
              🔓 Buka
            </button>
            <button id="btnServoA" onclick="servoControl('AUTO')">
              🔄 Auto
            </button>
          </div>
          <div class="timestamp" id="lastUpdate">Menunggu data...</div>
        </div>
      </div>
    </div>

    <script>
      let client;
      let feeds = {};

      function startConnect() {
        const username = document.getElementById("inputUser").value.trim();
        const key = document.getElementById("inputKey").value.trim();

        if (!username || !key) {
          alert("Username dan Key wajib diisi!");
          return;
        }

        // Simpan di memori browser saja (bukan localStorage)
        feeds = {
          gasLevel: `${username}/feeds/gas-level`,
          gasStatus: `${username}/feeds/gas-status`,
          temp: `${username}/feeds/temperature`,
          hum: `${username}/feeds/humidity`,
          fanStatus: `${username}/feeds/fan-status`,
          fanCtrl: `${username}/feeds/fan-control`,
          servoCtrl: `${username}/feeds/servo-control`,
        };

        client = mqtt.connect("wss://io.adafruit.com:443/mqtt", {
          username: username,
          password: key,
          clientId: "web_" + Math.random().toString(16).slice(2),
        });

        client.on("connect", () => {
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          document.getElementById("connDot").classList.add("connected");
          document.getElementById("connLabel").textContent =
            "Terhubung ke Adafruit IO";
          client.subscribe(Object.values(feeds));
        });

        client.on("error", (err) => {
          alert("Gagal konek! Cek username dan key lo.");
          console.error(err);
        });

        client.on("message", (topic, message) => {
          const val = message.toString();
          const now = new Date().toLocaleTimeString("id-ID");

          if (topic === feeds.gasStatus) {
            const el = document.getElementById("gasStatus");
            el.textContent = val;
            el.className = "value " + val;
          }
          if (topic === feeds.gasLevel) {
            const pct = parseInt(val);
            document.getElementById("gasLevel").textContent = pct;
            const bar = document.getElementById("gasBar");
            bar.style.width = pct + "%";
            bar.style.background =
              pct < 30 ? "#3fb950" : pct < 60 ? "#d29922" : "#f85149";
            document.getElementById("lastUpdate").textContent =
              "Update terakhir: " + now;
          }
          if (topic === feeds.temp)
            document.getElementById("temp").textContent =
              parseFloat(val).toFixed(1);
          if (topic === feeds.hum)
            document.getElementById("hum").textContent =
              parseFloat(val).toFixed(1);
          if (topic === feeds.fanStatus)
            document.getElementById("fanStatus").textContent = val;
          if (topic === feeds.servoCtrl)
            document.getElementById("regStatus").textContent =
              val === "TUTUP" ? "TERTUTUP" : "TERBUKA";
        });
      }

      function fanControl(cmd) {
        client.publish(feeds.fanCtrl, cmd);
      }
      function servoControl(cmd) {
        client.publish(feeds.servoCtrl, cmd);
      }
    </script>
  </body>
</html>
